<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pindle</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.min.css" />
  </head>
  <body>
    <div class="pindle">
      <div class="pindle__container">
        <div class="pindle-theme js-theme-switcher" role="group" aria-label="Theme switcher">
          <button
            class="pindle-theme__button js-theme-btn"
            data-theme="system"
            type="button"
            aria-label="Use system theme"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <rect x="3" y="4" width="18" height="12" rx="1.5" ry="1.5" />
              <line x1="8" y1="20" x2="16" y2="20" />
              <line x1="12" y1="16" x2="12" y2="20" />
            </svg>
          </button>
          <button
            class="pindle-theme__button js-theme-btn"
            data-theme="light"
            type="button"
            aria-label="Use light theme"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
          <button
            class="pindle-theme__button js-theme-btn"
            data-theme="dark"
            type="button"
            aria-label="Use dark theme"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3c0 .28 0 .57.02.85A7 7 0 0 0 20.15 12c.28.02.57.02.85.02z"
              />
            </svg>
          </button>
        </div>

        <button class="pindle-hint js-hint" type="button" aria-label="Get a hint">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M9 18h6" />
            <path d="M10 22h4" />
            <path
              d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1 1 1.7V18h6v-1.6c0-.7.4-1.3 1-1.7A7 7 0 0 0 12 2z"
            />
          </svg>
        </button>

        <div class="pindle-game">
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
          <div class="pindle-game__row">
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
            <div class="pindle-game__tile"></div>
          </div>
        </div>

        <p class="pindle-message js-message">Guess the 4-digit PIN</p>
        <button class="pindle-share js-share is-hidden" type="button">Share Result</button>

        <div class="pindle-keyboard">
          <div class="pindle-keyboard__row">
            <button class="pindle-keyboard__key" data-key="7" type="button">7</button>
            <button class="pindle-keyboard__key" data-key="8" type="button">8</button>
            <button class="pindle-keyboard__key" data-key="9" type="button">9</button>
          </div>
          <div class="pindle-keyboard__row">
            <button class="pindle-keyboard__key" data-key="4" type="button">4</button>
            <button class="pindle-keyboard__key" data-key="5" type="button">5</button>
            <button class="pindle-keyboard__key" data-key="6" type="button">6</button>
          </div>
          <div class="pindle-keyboard__row">
            <button class="pindle-keyboard__key" data-key="1" type="button">1</button>
            <button class="pindle-keyboard__key" data-key="2" type="button">2</button>
            <button class="pindle-keyboard__key" data-key="3" type="button">3</button>
          </div>
          <div class="pindle-keyboard__row">
            <button class="pindle-keyboard__key" data-key="backspace" type="button">DEL</button>
            <button class="pindle-keyboard__key" data-key="0" type="button">0</button>
            <button class="pindle-keyboard__key" data-key="enter" type="button">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.min.js" async defer></script>
  </body>
</html>
